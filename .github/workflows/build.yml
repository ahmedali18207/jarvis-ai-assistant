name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Flet CLI
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Build Android APK
      run: |
        flet build apk --output build/apk --python-version 3.12

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-apk
        path: build/apk/**/*.apk
